name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add-to-project:
    # Reusable Workflow の変更を、ほかのリポジトリーと同じ呼び出し方で検証するために相対参照で呼ぶ
    uses: ./.github/workflows/reusable-add-to-project.yml
    secrets:
      PROJECT_APP_PRIVATE_KEY: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
