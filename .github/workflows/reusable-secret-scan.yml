name: secret-scan

on:
  workflow_call:

# ジョブ名を変更する場合は、組織の Repository Rulesets の必須ステータスチェックも更新する
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: gitleaks
        # lefthook の secret-scan ジョブはステージした変更しか見ないため、ここでは全履歴をスキャンする
        run: gitleaks git --no-banner
