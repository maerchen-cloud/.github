name: pull-request-title

on:
  workflow_call:

# ジョブ名を変更する場合は、組織の Repository Rulesets の必須ステータスチェックも更新する
jobs:
  pull-request-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # type の一覧は .github/CONTRIBUTING.md と一致させる
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
