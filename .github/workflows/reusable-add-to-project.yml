name: add-to-project

on:
  workflow_call:
    secrets:
      PROJECT_APP_PRIVATE_KEY:
        description: 組織の Project に書き込む GitHub App の秘密鍵
        required: true

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN は組織の Project に書き込めないため、GitHub App のトークンだけを使用する
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # 組織の変数に登録した、組織の Project に書き込む GitHub App の Client ID
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          permission-issues: read
          permission-organization-projects: write

      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/maerchen-cloud/projects/1
          github-token: ${{ steps.app-token.outputs.token }}
