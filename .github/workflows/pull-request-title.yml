name: pull-request-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ジョブ名を変更する場合は、組織の Repository Rulesets の必須ステータスチェックも更新する
jobs:
  pull-request-title:
    # Reusable Workflow の変更をマージ前に検証するために相対参照で呼ぶ
    uses: ./.github/workflows/reusable-pull-request-title.yml
